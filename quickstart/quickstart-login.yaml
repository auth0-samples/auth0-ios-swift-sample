appType: "native"
technology: "ios"
technologyLabel: "iOS / macOS / visionOS"
sdkVersion: &sdkVersion "2.22"
outputFolderName: &outputFolderName "auth0-ios-sample"

# Native: origin is the Auth0 tenant domain, not localhost.
# {platform} is ios | macos | visionos (chosen via the applePlatform input).
# Callback URL (custom scheme): {bundleId}://{domain}/{platform}/{bundleId}/callback
# Callback URL (Universal Link, opt-in): https://{domain}/{platform}/{bundleId}/callback
defaultAppOrigin:
  scheme: "https"
  domain:
    inputKey: "auth0Domain"
callbackPath: "/%PLATFORM%/%BUNDLE_ID%/callback"
logoutPath: "/%PLATFORM%/%BUNDLE_ID%/callback"

inputs:
  auth0Domain:
  auth0ClientId:
  applePlatform:
    default: "ios"
  bundleId:
    default: "com.auth0.Sample"
  iosTeamId:

placeholders:
  "%GIT_REMOTE%":       { environmentKey: "gitRemote" }
  "%GIT_BRANCH%":       { environmentKey: "gitBranch" }
  "%DOWNLOAD_URL%":     { environmentKey: "downloadUrl" }
  "%FOLDER_NAME%":      *outputFolderName
  "%AUTH0_DOMAIN%":     { inputKey: "auth0Domain" }
  "%AUTH0_CLIENT_ID%":  { inputKey: "auth0ClientId" }
  "%PLATFORM%":         { inputKey: "applePlatform" }
  "%BUNDLE_ID%":        { inputKey: "bundleId" }
  "%APPLE_TEAM_ID%":    { inputKey: "iosTeamId" }
  "%SDK_VERSION%":      *sdkVersion

snippets:
  get-app: &getApp
    source: "quickstart/scripts/get-app.sh"
    language: "bash"
  configure: &configure
    source: "quickstart/scripts/configure.sh"
    language: "bash"
  auth0-plist: &auth0Plist
    source: "auth0-ios-sample/Auth0.plist"
    language: "xml"
  content-view: &contentView
    source: "auth0-ios-sample/ContentView.swift"
    language: "swift"
  build-and-run: &buildAndRun
    source: "quickstart/scripts/build-and-run.sh"
    language: "bash"

tryOutStep: &tryOutStep
  - title: "Try it out"
    contentBlocks:
      - type: markdown
        content: |
          1. Tap **Sign Up** to create a new account through the Auth0 Universal Login page.
          1. Verify your user profile is displayed, including your email and ID token claims.
          1. Tap **Log Out** to clear the session and return to the login screen.

download:
  - title: "Clone or download the sample app"
    contentBlocks:
      - type: markdown
        content: "Clone the sample application with the following command."
      - type: terminal
        <<: *getApp
      - type: markdown
        content: "Don't have `git` at hand? [Download as ZIP](%DOWNLOAD_URL%)"
  - title: "Configure your Auth0 credentials"
    contentBlocks:
      - type: markdown
        content: "Write your Auth0 domain and client ID into `Auth0.plist` and set the bundle identifier with the following command."
      - type: terminal
        <<: *configure
  - title: "Build and run"
    contentBlocks:
      - type: markdown
        content: "Open the project in Xcode, then select a simulator or connected device and click **Run** ▶."
      - type: terminal
        <<: *buildAndRun
  - <<: *tryOutStep

steps:
  - title: "Add the Auth0.swift SDK"
    contentBlocks:
      - type: markdown
        content: |
          Add the [**Auth0.swift**](https://github.com/auth0/Auth0.swift) package, then add the `Auth0` product to your app target.

          **Xcode** — open **File ▸ Add Package Dependencies…** and paste this URL:
      - type: snippet
        variant: "minimal"
        language: "text"
        content: "https://github.com/auth0/Auth0.swift"
      - type: markdown
        content: |
          **Package.swift** — add this to your `dependencies` array:
      - type: snippet
        variant: "minimal"
        language: "swift"
        content: '.package(url: "https://github.com/auth0/Auth0.swift", from: "%SDK_VERSION%.0")'
  - title: "Configure your Auth0 credentials"
    contentBlocks:
      - type: markdown
        content: "Create an `Auth0.plist` in your app bundle with your Auth0 domain and client ID. Auth0.swift reads these values automatically."
      - type: snippet
        <<: *auth0Plist
  - title: "Add login and logout"
    contentBlocks:
      - type: markdown
        content: "Use `Auth0.webAuth()` to open Universal Login. `CredentialsManager` stores the credentials in the Keychain and renews the session on launch using the refresh token (requested via the `offline_access` scope); the user profile is read directly from the ID token."
      - type: snippet
        <<: *contentView
  - <<: *tryOutStep

nextSteps:
  links:
    - label: "Auth0.swift SDK"
      url: "https://github.com/auth0/Auth0.swift"
    - label: "SDK Usage Examples"
      url: "https://github.com/auth0/Auth0.swift/blob/master/EXAMPLES.md"
